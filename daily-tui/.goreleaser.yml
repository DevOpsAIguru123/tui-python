version: 2

project_name: daily-tui

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - main: .
    binary: daily-tui
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

brews:
  - repository:
      owner: DevOpsAIguru123
      name: homebrew-tap
    name: daily-tui
    homepage: "https://github.com/DevOpsAIguru123/productivity-tools"
    description: "Terminal dashboard for WiFi & tasks"
    install: |
      bin.install "daily-tui"
