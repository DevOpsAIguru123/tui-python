version: 2
updates:
  # Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Example: if daily-tui is a Python project (uses pip / requirements.txt / pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/daily-tui"
    schedule:
      interval: "weekly"
